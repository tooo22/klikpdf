name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./KlikPDF.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlikPDF-Android-App
          path: ./KlikPDF.apk
          retention-days: 30

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: android-app
          name: "KlikPDF Android App (APK)"
          body: "Download file APK resmi KlikPDF untuk Android. Unduh dan buka di HP Android untuk memasang."
          files: ./KlikPDF.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

